<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Character Sheet | Nowhere Expeditions</title>
<!--
  Editable Fate Core sheet for Nowhere Expeditions.
  The public site fills in the JSON block near the end of this file when a player downloads it.
  "Save copy" writes a new copy of this same file with the edited sheet, which the GM imports in the content manager.
-->
<style>
  :root {
    --bg: #0d1517; --panel: #111c1f; --line: rgba(164, 192, 200, 0.2); --line-strong: rgba(164, 192, 200, 0.45);
    --text: #e7f0f2; --muted: #aebec2; --accent: #7ad7d1; --accent-2: #e0a85d; --danger: #d66d63;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 0 1rem 3rem; background: var(--bg); color: var(--text); font: 15px/1.5 "Segoe UI", sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  .wrap { max-width: 980px; margin: 0 auto; }
  .bar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.8rem; padding: 0.9rem 0; border-bottom: 1px solid var(--line); background: rgba(13, 21, 23, 0.95); }
  .kicker { display: block; color: var(--accent); font-size: 0.7rem; letter-spacing: 0.16em; text-transform: uppercase; }
  h1 { margin: 0.1rem 0 0; font-size: 1.7rem; letter-spacing: -0.02em; }
  h2 { margin: 0 0 0.6rem; font-size: 0.78rem; color: var(--muted); letter-spacing: 0.14em; text-transform: uppercase; }
  .actions { display: flex; align-items: center; gap: 0.8rem; }
  #status { color: var(--muted); font-size: 0.8rem; }
  #status.dirty { color: var(--accent-2); }
  .primary { padding: 0.6rem 1rem; border: 1px solid var(--accent-2); background: var(--accent-2); color: #101719; font-weight: 700; cursor: pointer; }
  .primary:hover { filter: brightness(1.08); }
  .help { margin: 1rem 0; color: var(--muted); font-size: 0.9rem; }
  .banner { margin: 0 0 1rem; padding: 0.7rem 0.9rem; border-left: 3px solid var(--accent-2); background: rgba(224, 168, 93, 0.08); font-size: 0.9rem; }
  .banner button { margin-left: 0.6rem; }
  section { margin-bottom: 1rem; padding: 1rem; border: 1px solid var(--line); background: var(--panel); }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
  .grid > section { margin-bottom: 0; }
  label.stack { display: grid; gap: 0.25rem; color: var(--muted); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; }
  input, select, textarea { width: 100%; min-height: 2.3rem; padding: 0.4rem 0.6rem; border: 1px solid var(--line-strong); border-radius: 0; background: #0a1113; }
  textarea { min-height: 4rem; resize: vertical; }
  input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid rgba(122, 215, 209, 0.6); outline-offset: 1px; }
  .aspect-input { font-family: Georgia, "Times New Roman", serif; font-style: italic; font-size: 1.05rem; }
  .rows { display: grid; gap: 0.45rem; }
  .row { display: grid; gap: 0.45rem; align-items: center; }
  .row-aspect { grid-template-columns: minmax(0, 1fr) 2.2rem; }
  .row-skill { grid-template-columns: minmax(0, 1fr) 11rem 2.2rem; }
  .row-stunt { grid-template-columns: minmax(0, 12rem) minmax(0, 1fr) 2.2rem; align-items: start; }
  .row-consequence { grid-template-columns: 7rem 4rem minmax(0, 1fr) 2.2rem; }
  .small { min-width: 2.2rem; height: 2.3rem; padding: 0 0.6rem; border: 1px solid var(--line-strong); background: transparent; cursor: pointer; }
  .small:hover { border-color: var(--accent); color: var(--accent); }
  .remove:hover { border-color: var(--danger); color: var(--danger); }
  .add { margin-top: 0.6rem; }
  .counter { display: flex; align-items: center; gap: 0.4rem; }
  .counter input { width: 4.5rem; text-align: center; font-size: 1.2rem; font-weight: 700; }
  .track { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.5rem 0.6rem; align-items: center; margin-bottom: 0.9rem; }
  .boxes { grid-column: 1 / -1; grid-row: 2; display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .box { width: 2.3rem; height: 2.3rem; border: 1px solid var(--line-strong); background: #0a1113; color: var(--muted); font-weight: 700; cursor: pointer; }
  .box[aria-pressed="true"] { border-color: var(--accent-2); background: rgba(224, 168, 93, 0.16); color: var(--accent-2); }
  .track-tools { display: flex; gap: 0.3rem; }
  .empty { color: var(--muted); font-size: 0.9rem; }
  @media (max-width: 720px) {
    .grid, .row-skill, .row-stunt, .row-consequence { grid-template-columns: 1fr; }
    .row .remove { justify-self: start; }
  }
  @media print {
    body { background: #fff; color: #000; }
    .bar { position: static; background: none; }
    .primary, .small, .help, .banner, #status { display: none !important; }
    section { break-inside: avoid; background: none; }
    input, select, textarea { border: 0; border-bottom: 1px solid #999; background: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <div><span class="kicker">Nowhere Expeditions · Fate Core sheet</span><h1 id="character-name">Character</h1></div>
    <div class="actions"><span id="status" role="status" aria-live="polite"></span><button type="button" class="primary" id="save-copy">Save copy</button></div>
  </header>
  <p class="help">Edit anything on this sheet during play. Changes are also kept in this browser while you work.
    Press <strong>Save copy</strong> to download the updated sheet file, then send the newest file to the GM after the session.</p>
  <div id="banner" class="banner" hidden></div>
  <main id="app"></main>
</div>
<script type="application/json" id="nowhere-sheet-data">null</script>
<script>
(() => {
  "use strict";
  const FORMAT = "nowhere-expeditions/fate-sheet";
  const LADDER = [[8, "Legendary"], [7, "Epic"], [6, "Fantastic"], [5, "Superb"], [4, "Great"], [3, "Good"],
    [2, "Fair"], [1, "Average"], [0, "Mediocre"], [-1, "Poor"], [-2, "Terrible"]];
  const app = document.getElementById("app");
  const statusText = document.getElementById("status");
  const banner = document.getElementById("banner");
  let envelope;
  try { envelope = JSON.parse(document.getElementById("nowhere-sheet-data").textContent || "null"); } catch { envelope = null; }
  if (!envelope || envelope.format !== FORMAT || !envelope.sheet) {
    app.innerHTML = '<p class="empty">This file does not contain a character sheet. Download it again from the character\'s page.</p>';
    document.getElementById("save-copy").hidden = true;
    return;
  }

  const clone = (value) => JSON.parse(JSON.stringify(value));
  const normalize = (sheet) => ({
    aspects: { highConcept: sheet.aspects?.highConcept || "", trouble: sheet.aspects?.trouble || "", other: [...(sheet.aspects?.other || [])] },
    skills: (sheet.skills || []).map((skill) => ({ name: skill.name || "", rating: Number(skill.rating) || 0 })),
    stunts: (sheet.stunts || []).map((stunt) => ({ name: stunt.name || "", description: stunt.description || "" })),
    refresh: sheet.refresh ?? 3,
    fatePoints: sheet.fatePoints ?? null,
    stress: (sheet.stress || []).map((track) => ({ name: track.name || "", boxes: (track.boxes || []).map(Boolean) })),
    consequences: (sheet.consequences || []).map((item) => ({ label: item.label || "", shift: Number(item.shift) || 2, aspect: item.aspect || "" })),
    extras: sheet.extras || ""
  });
  const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const draftKey = () => `nowhere-sheet:${envelope.characterId}:${envelope.exportedAt}:${envelope.savedAt || "original"}`;
  const storage = {
    read() { try { return JSON.parse(localStorage.getItem(draftKey()) || "null"); } catch { return null; } },
    write(value) { try { localStorage.setItem(draftKey(), JSON.stringify(value)); } catch { /* storage unavailable */ } },
    clear() { try { localStorage.removeItem(draftKey()); } catch { /* storage unavailable */ } }
  };
  const timeText = (iso) => iso ? new Date(iso).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }) : "";

  let state = normalize(envelope.sheet);
  let dirty = false;
  let draftTimer;

  document.getElementById("character-name").textContent = envelope.characterName || "Character";
  document.title = `${envelope.characterName || "Character"} — Character Sheet`;

  const draft = storage.read();
  if (draft?.sheet) {
    state = normalize(draft.sheet);
    dirty = true;
    banner.innerHTML = `Restored changes made in this browser on ${escapeHtml(timeText(draft.at))} that were not saved to a file yet. <button type="button" class="small" data-action="discard-draft">Discard them</button>`;
    banner.hidden = false;
  }

  const updateStatus = () => {
    statusText.classList.toggle("dirty", dirty);
    statusText.textContent = dirty ? "Unsaved changes, press Save copy"
      : envelope.savedAt ? `Saved ${timeText(envelope.savedAt)}` : "No changes yet";
  };

  const changed = () => {
    dirty = true;
    updateStatus();
    clearTimeout(draftTimer);
    draftTimer = setTimeout(() => storage.write({ at: new Date().toISOString(), sheet: state }), 300);
  };

  const removeButton = (list, index, label) => `<button type="button" class="small remove" data-action="remove" data-list="${list}" data-index="${index}" aria-label="Remove ${label}" title="Remove">×</button>`;
  const ladderOptions = (rating) => LADDER.map(([value, name]) => `<option value="${value}" ${value === rating ? "selected" : ""}>${name} (${value >= 0 ? "+" : ""}${value})</option>`).join("");

  const render = () => {
    app.innerHTML = `
      <section aria-labelledby="h-aspects">
        <h2 id="h-aspects">Aspects</h2>
        <div class="grid">
          <label class="stack">High Concept<input class="aspect-input" data-bind="highConcept" value="${escapeHtml(state.aspects.highConcept)}" /></label>
          <label class="stack">Trouble<input class="aspect-input" data-bind="trouble" value="${escapeHtml(state.aspects.trouble)}" /></label>
        </div>
        <div class="rows" style="margin-top:0.6rem">${state.aspects.other.map((aspect, index) => `
          <div class="row row-aspect"><input class="aspect-input" data-list="other" data-index="${index}" value="${escapeHtml(aspect)}" aria-label="Aspect ${index + 1}" />${removeButton("other", index, "aspect")}</div>`).join("")}</div>
        <button type="button" class="small add" data-action="add" data-list="other">+ Aspect</button>
      </section>

      <div class="grid">
        <section aria-labelledby="h-points">
          <h2 id="h-points">Fate points</h2>
          <div class="counter">
            <button type="button" class="small" data-action="fate" data-step="-1" aria-label="Spend a Fate point">−</button>
            <input type="number" min="0" data-bind="fatePoints" value="${state.fatePoints ?? ""}" aria-label="Current Fate points" />
            <button type="button" class="small" data-action="fate" data-step="1" aria-label="Gain a Fate point">+</button>
          </div>
        </section>
        <section aria-labelledby="h-refresh">
          <h2 id="h-refresh">Refresh</h2>
          <div class="counter"><input type="number" min="0" data-bind="refresh" value="${state.refresh ?? ""}" aria-label="Refresh" /></div>
        </section>
      </div>

      <div class="grid" style="margin-top:1rem">
        <section aria-labelledby="h-skills">
          <h2 id="h-skills">Skills</h2>
          <div class="rows">${state.skills.map((skill, index) => `
            <div class="row row-skill">
              <input data-list="skills" data-index="${index}" data-key="name" value="${escapeHtml(skill.name)}" placeholder="Skill" aria-label="Skill name" />
              <select data-list="skills" data-index="${index}" data-key="rating" aria-label="Skill rating">${ladderOptions(skill.rating)}</select>
              ${removeButton("skills", index, "skill")}
            </div>`).join("") || '<p class="empty">No skills.</p>'}</div>
          <button type="button" class="small add" data-action="add" data-list="skills">+ Skill</button>
        </section>
        <section aria-labelledby="h-stress">
          <h2 id="h-stress">Stress</h2>
          ${state.stress.map((track, index) => `
            <div class="track">
              <input data-list="stress" data-index="${index}" data-key="name" value="${escapeHtml(track.name)}" aria-label="Stress track name" />
              <div class="boxes">${track.boxes.map((marked, box) => `<button type="button" class="box" data-action="box" data-index="${index}" data-box="${box}" aria-pressed="${marked}" aria-label="${escapeHtml(track.name)} box ${box + 1}">${marked ? "X" : box + 1}</button>`).join("")}</div>
              <div class="track-tools">
                <button type="button" class="small" data-action="box-count" data-index="${index}" data-step="-1" aria-label="Remove a box" title="Remove a box">−□</button>
                <button type="button" class="small" data-action="box-count" data-index="${index}" data-step="1" aria-label="Add a box" title="Add a box">+□</button>
                ${removeButton("stress", index, "stress track")}
              </div>
            </div>`).join("") || '<p class="empty">No stress tracks.</p>'}
          <button type="button" class="small add" data-action="add" data-list="stress">+ Stress track</button>
          <h2 style="margin-top:1rem">Consequences</h2>
          <div class="rows">${state.consequences.map((item, index) => `
            <div class="row row-consequence">
              <input data-list="consequences" data-index="${index}" data-key="label" value="${escapeHtml(item.label)}" aria-label="Severity" />
              <input type="number" min="1" max="12" data-list="consequences" data-index="${index}" data-key="shift" value="${item.shift}" aria-label="Shifts" />
              <input class="aspect-input" data-list="consequences" data-index="${index}" data-key="aspect" value="${escapeHtml(item.aspect)}" placeholder="Free" aria-label="${escapeHtml(item.label)} consequence" />
              ${removeButton("consequences", index, "consequence")}
            </div>`).join("")}</div>
          <button type="button" class="small add" data-action="add" data-list="consequences">+ Consequence</button>
        </section>
      </div>

      <section aria-labelledby="h-stunts" style="margin-top:1rem">
        <h2 id="h-stunts">Stunts</h2>
        <div class="rows">${state.stunts.map((stunt, index) => `
          <div class="row row-stunt">
            <input data-list="stunts" data-index="${index}" data-key="name" value="${escapeHtml(stunt.name)}" placeholder="Stunt name" aria-label="Stunt name" />
            <textarea data-list="stunts" data-index="${index}" data-key="description" aria-label="Stunt description">${escapeHtml(stunt.description)}</textarea>
            ${removeButton("stunts", index, "stunt")}
          </div>`).join("") || '<p class="empty">No stunts.</p>'}</div>
        <button type="button" class="small add" data-action="add" data-list="stunts">+ Stunt</button>
      </section>

      <section aria-labelledby="h-extras">
        <h2 id="h-extras">Extras and notes</h2>
        <textarea data-bind="extras" rows="4" aria-label="Extras">${escapeHtml(state.extras)}</textarea>
      </section>`;
  };

  const lists = {
    other: () => state.aspects.other,
    skills: () => state.skills,
    stunts: () => state.stunts,
    stress: () => state.stress,
    consequences: () => state.consequences
  };
  const blanks = {
    other: () => "",
    skills: () => ({ name: "", rating: 1 }),
    stunts: () => ({ name: "", description: "" }),
    stress: () => ({ name: "", boxes: [false, false] }),
    consequences: () => ({ label: "", shift: 2, aspect: "" })
  };

  app.addEventListener("input", (event) => {
    const target = event.target;
    const number = (value) => value === "" ? null : Number(value);
    if (target.dataset.bind === "highConcept" || target.dataset.bind === "trouble") state.aspects[target.dataset.bind] = target.value;
    else if (target.dataset.bind === "extras") state.extras = target.value;
    else if (target.dataset.bind) state[target.dataset.bind] = number(target.value);
    else if (target.dataset.list === "other") state.aspects.other[Number(target.dataset.index)] = target.value;
    else if (target.dataset.list) {
      const key = target.dataset.key;
      lists[target.dataset.list]()[Number(target.dataset.index)][key] = key === "rating" || key === "shift" ? Number(target.value) : target.value;
    } else return;
    changed();
  });

  app.addEventListener("click", (event) => {
    const button = event.target.closest("[data-action]");
    if (!button) return;
    const index = Number(button.dataset.index);
    const action = button.dataset.action;
    if (action === "add") {
      lists[button.dataset.list]().push(blanks[button.dataset.list]());
    } else if (action === "remove") {
      lists[button.dataset.list]().splice(index, 1);
    } else if (action === "box") {
      const boxes = state.stress[index].boxes;
      boxes[Number(button.dataset.box)] = !boxes[Number(button.dataset.box)];
    } else if (action === "box-count") {
      const boxes = state.stress[index].boxes;
      if (Number(button.dataset.step) > 0 && boxes.length < 10) boxes.push(false);
      if (Number(button.dataset.step) < 0 && boxes.length) boxes.pop();
    } else if (action === "fate") {
      state.fatePoints = Math.max(0, (Number(state.fatePoints) || 0) + Number(button.dataset.step));
    } else return;
    const focusSelector = action === "box" ? `[data-action="box"][data-index="${index}"][data-box="${button.dataset.box}"]` : action === "fate" ? `[data-action="fate"][data-step="${button.dataset.step}"]` : null;
    render();
    changed();
    if (focusSelector) app.querySelector(focusSelector)?.focus();
    if (action === "add") [...app.querySelectorAll(`[data-list="${button.dataset.list}"]`)].pop()?.focus();
  });

  banner.addEventListener("click", (event) => {
    if (event.target.dataset.action !== "discard-draft") return;
    storage.clear();
    state = normalize(envelope.sheet);
    dirty = false;
    banner.hidden = true;
    render();
    updateStatus();
  });

  document.getElementById("save-copy").addEventListener("click", () => {
    const next = { ...envelope, savedAt: new Date().toISOString(), sheet: clone(state) };
    const copy = document.documentElement.cloneNode(true);
    copy.querySelector("#app").innerHTML = "";
    copy.querySelector("#banner").innerHTML = "";
    copy.querySelector("#banner").hidden = true;
    copy.querySelector("#status").textContent = "";
    copy.querySelector("#status").className = "";
    // "<" is escaped so the sheet text can never close the script block.
    copy.querySelector("#nowhere-sheet-data").textContent = JSON.stringify(next).replace(/</g, "\\u003c");
    const blob = new Blob([`<!DOCTYPE html>\n${copy.outerHTML}`], { type: "text/html;charset=utf-8" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `${envelope.characterId || "character"}-sheet.html`;
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
    storage.clear();
    envelope = next;
    dirty = false;
    banner.hidden = true;
    updateStatus();
  });

  window.addEventListener("beforeunload", (event) => {
    if (!dirty) return;
    event.preventDefault();
    event.returnValue = "";
  });

  render();
  updateStatus();
})();
</script>
</body>
</html>
