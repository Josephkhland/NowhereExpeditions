<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Expedition Board has moved | Nowhere Expeditions</title>
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="jobs.html" />
    <script>
      // Expedition IDs became Job IDs unchanged; a report anchor (#e-17#report-x) now points at its Session Record.
      const [jobId, anchor] = window.location.hash.slice(1).split("#");
      window.location.replace(anchor && anchor.startsWith("report-") ? "reports.html#" + anchor.slice(7) : "jobs.html" + (jobId ? "#" + jobId : ""));
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=jobs.html" /></noscript>
  </head>
  <body>
    <p>The Expedition Board is now <a href="jobs.html">jobs.html</a>.</p>
  </body>
</html>
