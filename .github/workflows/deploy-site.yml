# Publishes public-site/ to GitHub Pages whenever it changes on the main branch.
# One-time setup: repository Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy public site

on:
  push:
    branches: [main]
    paths:
      - "public-site/**"
      - ".github/workflows/deploy-site.yml"
  # Allows a manual redeploy from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer push waits rather than cancelling a deploy in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload public-site as the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
